name: Release

# Releases are tag-driven: merging a release PR (version bump on main whose
# vX.Y.Z tag does not exist yet) or pushing a vX.Y.Z tag cuts a release. The
# GitHub release and the npm publish are performed by this workflow on the
# owner's behalf — per AGENTS.md, agents never run release actions locally.
on:
  push:
    branches:
      - main
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: write # create the git tag and GitHub release
  id-token: write # npm provenance / trusted publishing (OIDC)

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Check if release is needed
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check_tag.outputs.should_release }}
      tag_name: ${{ steps.check_tag.outputs.tag_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine if release is needed
        id: check_tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG_NAME="${{ github.ref_name }}"
            echo "Triggered by tag push. Tag: $TAG_NAME"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          else
            VERSION=$(jq -r .version package.json)
            TAG_NAME="v$VERSION"
            echo "Triggered by main push. Package version: $VERSION (tag: $TAG_NAME)"
            if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
              echo "Tag $TAG_NAME already exists. Skipping release."
              echo "should_release=false" >> "$GITHUB_OUTPUT"
            else
              echo "Tag $TAG_NAME does not exist. Proceeding with release."
              echo "should_release=true" >> "$GITHUB_OUTPUT"
              echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
            fi
          fi

  release:
    name: Check, test, and publish
    needs: check
    if: needs.check.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run check

      - name: Run tests
        run: pnpm test

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ needs.check.outputs.tag_name }}" \
            --title "${{ needs.check.outputs.tag_name }}" \
            --generate-notes

      - name: Publish to npm
        run: pnpm publish --provenance --no-git-checks
